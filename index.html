<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Manual interactivo de soporte UrgeGas</title>
<style>
:root{--bg:#fff;--fg:#1d2430;--mut:#667;--card:#f4f6f9;--ac:#d9341f;--ok:#1a8a4a;--bad:#c62828;--bd:#dde2ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12171f;--fg:#e8ecf2;--mut:#9aa5b5;--card:#1c2430;--bd:#2d3748}}
:root[data-theme=dark]{--bg:#12171f;--fg:#e8ecf2;--mut:#9aa5b5;--card:#1c2430;--bd:#2d3748}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:18px 16px 4px;max-width:820px;margin:auto}h1{margin:0;font-size:1.45rem}h1 span{color:var(--ac)}header p{margin:2px 0;color:var(--mut)}
nav{display:flex;gap:6px;padding:8px 16px;max-width:820px;margin:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:2}
main{max-width:820px;margin:auto;padding:4px 16px 40px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:7px 13px;border-radius:999px;cursor:pointer}
button.on,button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
input{width:100%;font:inherit;padding:11px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0}.chips button{white-space:nowrap}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;margin:10px 0}
details.card summary{cursor:pointer;font-weight:600;list-style:none}details.card summary small{display:block;font-weight:400;color:var(--mut)}
.say{border-left:4px solid var(--ok);padding:6px 12px;margin:10px 0;background:var(--bg);border-radius:0 8px 8px 0}
.warn{border-left:4px solid var(--ac);padding:6px 12px;margin:10px 0;background:var(--bg);border-radius:0 8px 8px 0}
.lb{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
img{max-width:100%;height:auto;border-radius:8px;display:block;margin:8px auto}figcaption{font-size:.85rem;color:var(--mut);text-align:center}
.vid{display:inline-block;margin:4px 6px 4px 0;padding:10px 14px;border-radius:10px;background:#c4302b;color:#fff;text-decoration:none;font-weight:600}
.opt{display:block;width:100%;text-align:left;margin:8px 0;border-radius:10px}.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.no{background:var(--bad);color:#fff;border-color:var(--bad)}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.fb{margin-top:10px;padding:10px 12px;border-radius:8px;background:var(--bg);border:1px solid var(--bd)}a.lk{color:var(--ac);cursor:pointer;text-decoration:underline}
</style></head><body>
<header><h1>Guía de soporte <span>UrgeGas</span></h1><p>Busca la situación del cliente, responde y resuelve.</p></header>

{c:3,t:"«Le entró agua» / «¿resiste la lluvia?»",k:"agua lluvia humedad garantía cambio IP57 tapas",r:"Sí resiste lluvia y chorros de agua (IP57), pero no inmersión prolongada.",s:["Pregunta si las tapas de las baterías estaban bien atornilladas.","Tapas bien cerradas y hubo filtración → aplica garantía y se cambia el equipo.","Tapas mal cerradas → no aplica garantía por humedad."],w:"Todo medidor con falla por agua se devuelve al fabricante para auditoría."},
{c:3,t:"«La batería se gasta rápido» / «¿cuánto duran?»",k:"batería pilas duración litio sleep instalación 10 minutos",r:"Es normal: al instalar, el equipo busca señal y gasta más. Ya instalado pasa a modo de bajo consumo y dura meses o años.",s:["Duración normal: 1–2 años (familia promedio).","Con pilas de litio: hasta 5 años; recomendadas para negocios de alto consumo.","Si el cliente lleva más de 10 minutos instalando, que se detenga y llame a soporte."]},
{c:0,t:"«Marca siempre 0» / «no detecta el gas»",k:"cero 0 no detecta lectura silicón grosor 7 mm superficie zona verde óxido pintura",r:"Vamos a revisar tres cosas: la cubierta, el grosor del tanque y la superficie donde está pegado.",s:["¿Quitó la cubierta roja de silicón? Sin ella la lectura siempre es 0.","Lámina de más de 7 mm no se puede leer (lo normal es 4 mm).","Colocarlo en la zona verde: lisa, limpia y con pintura delgada. Comprobar con los dedos: sin aspereza ni porosidad.","Debe quedar bien centrado, sin huecos."],i:[[0,"Sin la cubierta de silicón siempre marca 0"],[1,"Óxido, doble pintura y aspereza bloquean la señal"],[2,"Revisar la textura con la mano"],[3,"Zona verde (✔) vs zona dañada (✖)"]]},
{c:0,t:"«Mi tanque está oxidado, muy pintado o dañado» / «quiero lijarlo»",k:"oxidado lijar lija corrosión poroso dañado cambiar tanque explosión",r:"Para su seguridad, que un profesional de mantenimiento de tanques lo revise; puede ser momento de cambiarlo.",s:["Buscar una zona sana pequeña; si solo hay una, es señal de revisar o cambiar el tanque.","Algunos técnicos logran pulir el óxido y dejar la superficie lisa."],w:"NUNCA lijar por cuenta propia: puede producir chispa, fuga y explosión fatal.",i:[[4,"Solo una zona sana: conviene revisar el tanque"]]},
{c:0,t:"«Leía bien y de pronto marca 0 o es inestable»",k:"inestable cero cayó repente movió mascota prueba de instalación cinta",r:"Lo más probable es que el equipo se movió (mascota o curioso). Hay que recolocarlo.",s:["Ejecutar la prueba de instalación en la app.","Recolocar firme y centrado.","Asegurar el contorno con cinta para exteriores."],i:[[7,"Bien centrado vs. con huecos"]],v:[["xZLXz2A2ps4","Video: prueba de instalación"]]},
{c:0,t:"«La aguja marca 65% y Urgegas 71%»",k:"aguja flotador diferencia 65 71 medidor mecánico",r:"Son sistemas distintos: la aguja usa un flotador mecánico con error de 5% o más según su desgaste; Urgegas mide por ultrasonido y es más preciso.",s:["No tomar la aguja como referencia perfecta.","Para mejor medición: mantener y nivelar el tanque."]},
{c:0,t:"«¿Qué tan exactas son las lecturas?» / «se ven raras»",k:"exactitud precisión margen error 2% nivelado modelo marca compensación temperatura calor frío densidad",r:"Margen de ±2% si el tanque está nivelado y la marca/modelo es correcto en la app.",s:["Verificar que el tanque esté nivelado.","Verificar marca y modelo elegidos en la app (error muy común).","Compensación de temperatura (Configuraciones): el gas se expande con calor y se contrae con frío; el ajuste evita que se alteren las lecturas.","La densidad del gas puede dar variaciones menores."]},
{c:1,t:"«Se me resbaló el pegamento» / «¿cuándo coloco el equipo?»",k:"pegamento epóxico resbaló manchón esperar 5 minutos fraguado alcohol",r:"Tranquilo, hay que actuar rápido: el epóxico endurece en 1–2 minutos.",s:["Retirar el sensor de inmediato.","Limpiar tanque y equipo con alcohol etílico o isopropílico antes de que fragüe.","Secar bien, mezclar porción nueva en partes iguales y recolocar.","Esperar 5 minutos antes de montar el equipo para que no se deslice con el peso."]},
{c:1,t:"«Mi tanque siempre está húmedo» / «vivo en la costa»",k:"humedad condensación costa salitre grasa dieléctrica permatex 1000 litros silicón corrosión",r:"En tanques grandes con condensación o en costa, se usa grasa dieléctrica Permatex.",s:["Limpiar muy bien la zona.","Retirar la tapa de silicón y poner una capa generosa de grasa sobre el sensor.","Colocar lentamente para sellar. Urgegas incluirá la grasa en tanques de 1,000 L o más."],i:[[8,"Grasa dieléctrica Permatex sobre el sensor"]]},
{c:1,t:"«¿Se va a caer?» / «me lo mueven»",k:"imán fuerte caer pegar cinta camiones fijar",r:"El imán es de alta retención; hasta camiones y pipas lo llevan solo con imán sin que se caiga.",s:["Si lo mueven seguido: asegurar con cinta para exteriores.","También se ofrece pegamento."]},
{c:2,t:"«La app dice Sin conexión a cada rato»",k:"sin conexión señal wifi 2.4 repetidor celular muros",r:"No necesariamente es su teléfono: probablemente la señal en el punto del tanque es débil.",s:["Revisar señal Wi-Fi 2.4 GHz o celular junto al tanque (muros gruesos, patios cerrados).","Valorar un repetidor Wi-Fi económico."]},
{c:2,t:"«La app no encuentra mi dispositivo»",k:"vincular módem 5 GHz contraseña no encuentra reiniciar pila",r:"Casi siempre es la red: el equipo solo reconoce Wi-Fi de 2.4 GHz.",s:["Confirmar red de 2.4 GHz (no 5 GHz).","Revisar contraseña, sin espacios extra.","Si persiste: retirar una pila 5 segundos y repetir la vinculación."]},
{c:5,t:"«Me llegó una alerta de anomalía» / «bajó el consumo de golpe»",k:"alerta anomalía fuga consumo gráfica hermeticidad desalineó",r:"Es una alerta de seguridad: el equipo se desalineó o hay una variación atípica, posiblemente una fuga.",s:["Revisar físicamente la posición del medidor.","Hacer prueba de hermeticidad en las conexiones y mangueras."],w:"Tomar siempre en serio: puede haber fuga."},
{c:5,t:"«Me robaron el dispositivo»",k:"robo robaron ladrón bloquear usar otra persona",r:"No le sirve a nadie más: está vinculado al primer usuario que lo registró.",s:["Reportarlo a Urgegas para bloquear el identificador."]},
{c:4,t:"«¿Pago datos o mensualidad?»",k:"pago suscripción mensualidad datos celulares administrador edificio hotel gasera",r:"No, para hogares no hay plan de datos ni suscripción.",s:["Solo hay modelo con suscripción para administradores de edificios, hoteles, fraccionamientos y gaseras con muchos tanques."]},
{c:4,t:"«¿Puedo compartirlo con mi esposo/a?» / «¿cuántos tanques?»",k:"compartir códigos esposa tanques gratis cuenta",r:"Sí, hasta con 3 personas más.",s:["En Configuraciones se crean 3 códigos para compartir.","Cada cuenta registra hasta 5 tanques gratis."]},
{c:4,t:"«La marca de mi tanque no aparece en la app»",k:"marca no aparece modelo app registrar",r:"Se puede resolver de dos formas.",s:["Elegir otra marca con el mismo modelo y dimensiones.","O contactar a Urgegas: la marca se agrega tras una breve validación."]}];

let tab=0,qi=0,ans=[],done=false,cat=-1,qs="",open=-1;const m=document.getElementById("m"),nav=document.getElementById("nav");
const tabs=["Situaciones","Evaluación"];
function go(t,s){tab=t;if(s!=null){open=s;cat=-1;qs=""}render();if(s!=null)setTimeout(()=>{const e=document.getElementById("s"+s);e&&e.scrollIntoView()},50);else scrollTo(0,0)}
function card(x,i){return`<details class="card" id="s${i}" ${open==i?'open':''}><summary>${x.t}<small>${C[x.c]}</small></summary><div class="say"><div class="lb">Responde así</div>${x.r}</div><div class="lb">Pasos</div><ol>${x.s.map(p=>`<li>${p}</li>`).join("")}</ol>${x.w?`<div class="warn"><div class="lb">Cuidado</div>${x.w}</div>`:""}${(x.i||[]).map(fig).join("")}${(x.v||[]).map(v=>V(v[0],v[1])).join("")}</details>`}
function list(){const q=qs.toLowerCase().trim();document.getElementById("res").innerHTML=S.map((x,i)=>[x,i]).filter(([x])=>(cat<0||x.c==cat)&&(!q||(x.t+x.k+x.r).toLowerCase().includes(q))).map(([x,i])=>card(x,i)).join("")||'<p>Sin resultados. Prueba con otra palabra.</p>'}
function render(){nav.innerHTML=tabs.map((x,i)=>`<button class="${i==tab?'on':''}" onclick="go(${i})">${x}</button>`).join("");
if(tab==0){m.innerHTML=`<input id="q" placeholder="Busca: agua, marca 0, sin conexión, pegamento…" value="${qs}" oninput="qs=this.value;list()"><div class="chips"><button class="${cat<0?'on':''}" onclick="cat=-1;render()">Todas</button>${C.map((c,i)=>`<button class="${cat==i?'on':''}" onclick="cat=${i};render()">${c}</button>`).join("")}</div><div id="res"></div><div class="card"><div class="lb">Videos de apoyo</div>${V("xZLXz2A2ps4","Prueba de instalación")}${V("PAvAL4v5ySA","Video 2")}${V("TX2NKRUH4_o","Video 3")}</div>`;list()}
else quiz()}
function quiz(){if(done){const s={};ans.forEach((a,i)=>{const l=Q[i][0];s[l]=s[l]||[0,0];s[l][1]++;if(a===Q[i][3])s[l][0]++});const ok=ans.filter((a,i)=>a===Q[i][3]).length,p=Math.round(ok/Q.length*100);
const lv=p>=85?"Avanzado":p>=60?"Intermedio":"Básico: repasa las situaciones marcadas";
m.innerHTML=`<div class="card"><h3>Resultado: ${ok}/${Q.length} (${p}%)</h3><b>Nivel: ${lv}</b></div>${Object.keys(s).map(l=>{const [a,b]=s[l],f=a<b;return`<div class="card"><b>${S[l].t}</b> — ${a}/${b}<div class="bar"><i style="width:${a/b*100}%"></i></div>${f?`<a class="lk" onclick="go(0,${l})">Repasar esta situación →</a>`:"✔ Dominada"}</div>`}).join("")}<button class="pri" onclick="qi=0;ans=[];done=false;render()">Reintentar</button>`;return}
const q=Q[qi],a=ans[qi],st=a!==undefined;
m.innerHTML=`<div class="bar"><i style="width:${qi/Q.length*100}%"></i></div><p>Situación ${qi+1} de ${Q.length}</p><div class="card"><b>${q[1]}</b>${q[2].map((o,i)=>`<button class="opt ${st?(i==q[3]?'ok':i==a?'no':''):''}" ${st?'disabled':''} onclick="pick(${i})">${o}</button>`).join("")}${st?`<div class="fb">${a==q[3]?'✅ <b>¡Correcto!</b> ':'❌ <b>Incorrecto.</b> Correcta: <b>'+q[2][q[3]]+'</b>. '}${q[4]}${a==q[3]?'':`<br>Repasa: <a class="lk" onclick="go(0,${q[0]})">${S[q[0]].t}</a>`}</div>`:''}</div>${st?`<button class="pri" onclick="nextQ()">${qi==Q.length-1?'Ver resultado':'Siguiente'}</button>`:''}`}
function pick(i){ans[qi]=i;render()}function nextQ(){if(qi==Q.length-1)done=true;else qi++;render()}
render();
</script></body></html>
